[package]
name = "quantum-box"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Anonymous sealed box with a post-quantum hybrid KEM (ML-KEM + X25519)"
exclude = ["header-full.jpg"]

[dependencies]
base64 = "0.22"
getrandom = { version = "0.4", features = ["sys_rng"] }
hpke = { version = "0.14", default-features = false, features = ["alloc", "chacha", "mlkem", "x25519"] }
thiserror = "2"
x-wing = { version = "0.1", features = ["zeroize"] }
zeroize = "1"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

[features]
wasm_js = ["getrandom/wasm_js"]

[lints.rust]
missing_docs = "deny"
dead_code = "deny"
unsafe_code = "forbid"


[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic relaxations (too noisy)
module_name_repetitions = "allow"
similar_names = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
